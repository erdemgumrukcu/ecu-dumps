name: "Profile-EVC"
manufacturer: "BEAVER"
description: "HOME Emulator Electric Vehicle Charger Virtual Device."
model: "Virtual-EVC"
labels:
  - "virtual"
  - "BEAVER"
  - "HEMS"
deviceResources:
  - name: "ActivePower"
    isHidden: false
    description: "HOME Emulator Electric Vehicle Charger Virtual Device — Active Power."
    properties:
      valueType: "Float64"
      readWrite: "RW"
      defaultValue: 11.0
  - name: "ReactivePower"
    isHidden: false
    description: "HOME Emulator Electric Vehicle Charger Virtual Device — Reactive Power."
    properties:
      valueType: "Float64"
      readWrite: "RW"
      defaultValue: 0.0
  - name: "BatterySOC"
    isHidden: false
    description: "HOME Emulator Electric Vehicle Charger Virtual Device — State of Charge."
    properties:
      valueType: "Float64"
      readWrite: "RW"
      defaultValue: 0.5
  - name: "BatteryCapacity"
    isHidden: false
    description: "HOME Emulator Electric Vehicle Charger Virtual Device — Battery Capacity."
    properties:
      valueType: "Float64"
      readWrite: "RW"
      defaultValue: 50.0
  - name: "BatteryMaxChargingPower"
    isHidden: false
    description: "HOME Emulator Electric Vehicle Charger Virtual Device — Battery Maximum Charging Power."
    properties:
      valueType: "Float64"
      readWrite: "RW"
      defaultValue: 11.0
  - name: "BatteryMaxDischargingPower"
    isHidden: false
    description: "HOME Emulator Electric Vehicle Charger Virtual Device — Battery Maximum Discharging Power."
    properties:
      valueType: "Float64"
      readWrite: "RW"
      defaultValue: 11.0
deviceCommands:
  - name: "ReadAll"
    isHidden: false
    description: "Read-only collection of all HOME Emulator Electric Vehicle Charger Virtual Device resources"
    readWrite: "R"
    resourceOperations:
      - { deviceResource: "ActivePower" }
      - { deviceResource: "ReactivePower" }
      - { deviceResource: "BatterySOC" }
      - { deviceResource: "BatteryCapacity" }
      - { deviceResource: "BatteryMaxChargingPower" }
      - { deviceResource: "BatteryMaxDischargingPower" }