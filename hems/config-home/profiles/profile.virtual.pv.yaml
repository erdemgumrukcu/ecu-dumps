name: "Profile-PV"
manufacturer: "BEAVER"
description: "HOME Emulator PV Virtual Device."
model: "Virtual-PV"
labels:
  - "virtual"
  - "BEAVER"
  - "HEMS"
deviceResources:
  - name: "ActivePower"
    isHidden: false
    description: "HOME Emulator PV Virtual Device — Active Power."
    properties:
      valueType: "Float64"
      readWrite: "RW"
      defaultValue: 6.0
  - name: "ReactivePower"
    isHidden: false
    description: "HOME Emulator PV Virtual Device — Reactive Power."
    properties:
      valueType: "Float64"
      readWrite: "RW"
      defaultValue: 0.0
deviceCommands:
  - name: "ReadAll"
    isHidden: false
    description: "Read-only collection of all HOME Emulator PV Virtual Device resources"
    readWrite: "R"
    resourceOperations:
      - { deviceResource: "ActivePower" }
      - { deviceResource: "ReactivePower" }