name: edgeismp-hems

services:
  miniflex:
    image: miniflex:local
    platform: linux/arm64
    container_name: miniflex
    depends_on:
      device-hems:
        condition: service_started
    environment:
      HEMS_FLEX_READ_PATH: "http://edgex-device-hems:59986/api/v3/device/name/Device-HEMS/flexibility-range?delta_t_seconds=900"
      HEMS_FLEX_SET_PATH: "http://edgex-device-hems:59986/api/v3/device/name/Device-HEMS/flexibility-set"
      TRAFO_SENSOR_P_READ_PATH: "http://edgex-core-command:59882/api/v3/device/name/Device-PQI/trafo_p"
      CONTROL_REFRESH_INTERVAL_SECONDS: "60"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      - edgex-network
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "2002:2001"

  device-pqi:
    command:
      - -cp=keeper.http://edgex-core-keeper:59883
      - --registry
    container_name: edgex-device-pqi
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-device-modbus-bridge
      SERVICE_SERVERBINDADDR: edgex-device-modbus-bridge
      SERVICE_PORT: "59901"
      DEVICE_DEVICESDIR: /custom-config/devices
      DEVICE_PROFILESDIR: /custom-config/profiles
      WRITABLE_LOGLEVEL: DEBUG
    hostname: edgex-device-pqi
    #image: edgexfoundry/device-modbus:3.1.1
    image: nexus3.edgexfoundry.org:10004/device-modbus-arm64:latest
    platform: linux/arm64
    networks:
      edgex-network:
        aliases:
          - edgex-device-modbus-bridge
      macvlan:
        ipv4_address: 169.254.84.11
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 59901
        published: "59901"
        protocol: tcp
    read_only: true
    restart: always
    security_opt:
      - no-new-privileges:true
    user: 2002:2001
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ./config-modbus
        target: /custom-config
        read_only: true
        bind:
          create_host_path: true

  device-hems:
    image: nexus3.edgexfoundry.org:10004/device-rest-arm64:latest
    platform: linux/arm64
    container_name: edgex-device-hems
    hostname: edgex-device-hems
    command:
      - --registry
      - -cp=keeper.http://edgex-core-keeper:59883
      - --instance=hems
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-device-hems
      SERVICE_SERVERBINDADDR: 0.0.0.0
      SERVICE_PORT: "59986"
      CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
      CLIENTS_CORE_DATA_HOST: edgex-core-data
      MESSAGEBUS_HOST: edgex-mqtt-broker
      MESSAGEBUS_OPTIONAL_CLIENTID: device-rest-hems
      DEVICE_DEVICESDIR: /custom-config/devices
      DEVICE_PROFILESDIR: /custom-config/profiles
      WRITABLE_LOGLEVEL: INFO
    networks:
      - edgex-network
    volumes:
      - ./config-rest/devices:/custom-config/devices:ro
      - ./config-rest/profiles:/custom-config/profiles:ro
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "2002:2001"

networks:
  edgex-network:
    external: true
    name: edgex_edgex-network

  macvlan:
    external: true
    name: edgex_macvlan